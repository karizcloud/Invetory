x-env: &env
  DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory}@postgres:5432/${POSTGRES_DB:-inventory}
  REDIS_URL: redis://redis:6379/0
  KAFKA_BROKER: redpanda:9092
  RABBIT_URL: amqp://guest:guest@rabbitmq:5672/%2F
  DATA_DIR: /opt/project/data
  AIRFLOW_URL: http://airflow:8080
  AIRFLOW_USER: ${AIRFLOW_USER:-admin}
  AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
  PYTHONPATH: /opt/project
x-py: &py
  build: .
  environment: *env
  volumes: ["./data:/opt/project/data"]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    redpanda: {condition: service_healthy}
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes: ["pgdata:/var/lib/postgresql/data", "./sql:/docker-entrypoint-initdb.d"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U inventory"], interval: 5s, retries: 20}
  redis:
    image: redis:7
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 20}
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]
    healthcheck: {test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 10s, retries: 20}
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
    healthcheck: {test: ["CMD-SHELL","rpk cluster info"], interval: 10s, retries: 20}
  redpanda-console:
    image: redpandadata/console:v2.6.0
    environment: {KAFKA_BROKERS: "redpanda:9092"}
    ports: ["8080:8080"]
    depends_on: {redpanda: {condition: service_healthy}}
  airflow:
    image: apache/airflow:2.9.3-python3.11
    environment:
      <<: *env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://inventory:inventory@postgres/airflow
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _PIP_ADDITIONAL_REQUIREMENTS: "redis==5.0.8 scikit-learn==1.5.1 pika==1.3.2"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.c || true) &&
      (airflow scheduler &) && exec airflow webserver"
    volumes: ["./dags:/opt/airflow/dags","./src:/opt/project/src","./ml:/opt/project/ml","./data:/opt/project/data"]
    ports: ["8081:8080"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8080/health"], interval: 20s, retries: 30}
  app:
    <<: *py
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
  producer:
    <<: *py
    command: python -m workers.producer
  consumer:
    <<: *py
    command: python -m workers.consumer
  alert-worker:
    <<: *py
    command: python -m workers.alert_worker
volumes:
  pgdata:
